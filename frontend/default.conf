server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS (127.0.0.11) re-resolves "volatility3" to its
    # current container IP. Using a variable in proxy_pass (instead of a bare
    # hostname) forces nginx to actually re-resolve per this resolver's TTL
    # rather than caching the IP for the worker process's lifetime - without
    # this, restarting/rebuilding the volatility3 container leaves nginx
    # stuck pointing at the old (now-dead) IP until nginx itself is restarted.
    resolver 127.0.0.11 valid=10s;
    set $volatility3_upstream volatility3:8000;

    # WebSocket progress stream - must come before the generic /api/ block so
    # the Upgrade/Connection headers are only forced on this path.
    location ~ ^/api/jobs/[^/]+/progress$ {
        proxy_pass http://$volatility3_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://$volatility3_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 0; # memory images can be many GB
    }

    location /health {
        proxy_pass http://$volatility3_upstream/health;
    }

    # SPA fallback - client-side routing (react-router) owns all other paths
    location / {
        try_files $uri /index.html;
    }
}
